# tmux configuration

# Remap prefix from 'Ctrl+b' to 'Ctrl+Space'
unbind C-b
set-option -g prefix C-Space
bind-key C-Space send-prefix

# Reload config
bind r source-file ~/.tmux.conf \; display-message "Config reloaded!"

# Vim-style pane splitting (inherit current directory)
bind V split-window -v -c "#{pane_current_path}"
bind v split-window -h -c "#{pane_current_path}"

# Manual save binding
bind s run-shell '~/.tmux/plugins/tmux-resurrect/scripts/save.sh'
unbind '"'
unbind %

# Switch panes using Alt+arrow without prefix
bind -n M-Left select-pane -L
bind -n M-Right select-pane -R
bind -n M-Up select-pane -U
bind -n M-Down select-pane -D

# Performance
set -g history-limit 10000
set -s escape-time 0

# Start numbering at 1
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on

# Mouse
set -g mouse on

# Smart scroll
bind -n WheelUpPane if-shell -F "#{alternate_on}" "send-keys -M" "copy-mode -e; send-keys -M"
bind -n WheelDownPane if-shell -F "#{alternate_on}" "send-keys -M" "send-keys -M"

# Mouse drag
unbind -T root MouseDrag1Pane
bind -T root MouseDrag1Pane if-shell -F "#{alternate_on}" "send-keys -M" "copy-mode -M"

# Copy mode
bind k copy-mode
setw -g mode-keys vi

# Copy bindings - cross-platform clipboard
bind-key -T copy-mode-vi v send-keys -X begin-selection
bind-key -T copy-mode-vi y send-keys -X copy-pipe 'sed "s/[[:space:]]*$//" | if command -v xclip >/dev/null 2>&1; then xclip -selection clipboard -i; elif command -v pbcopy >/dev/null 2>&1; then pbcopy; fi'
bind-key -T copy-mode-vi r send-keys -X rectangle-toggle
bind-key -T copy-mode-vi Enter send-keys -X copy-pipe-and-cancel 'sed "s/[[:space:]]*$//" | if command -v xclip >/dev/null 2>&1; then xclip -selection clipboard -i; elif command -v pbcopy >/dev/null 2>&1; then pbcopy; fi'

# Mouse: highlight only, don't auto-copy
bind-key -T copy-mode-vi MouseDragEnd1Pane send-keys -X stop-selection
bind-key -T copy-mode-vi MouseDown1Pane send-keys -X clear-selection

# Exit copy mode
bind-key -T copy-mode-vi Escape send-keys -X cancel
bind-key -T copy-mode-vi q send-keys -X cancel

# Alt+hjkl pane switching
bind-key -n M-h select-pane -L
bind-key -n M-j select-pane -D
bind-key -n M-k select-pane -U
bind-key -n M-l select-pane -R

# Window management
unbind c
bind n new-window
bind -r h previous-window
bind -r l next-window

# Pane resizing
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

# Move window to pane
bind b command-prompt -p "Move window to current as pane (horizontal):" "join-pane -h -s :%%"
bind B command-prompt -p "Move window to current as pane (vertical):" "join-pane -v -s :%%"
bind a break-pane

# File exploration
bind f new-window -c "~" 'file=$(fzf) && nvim "$file"'
bind / new-window -c "#{pane_current_path}" 'nvim .'
bind F new-window -c "#{pane_current_path}" 'find . -type d | fzf | xargs -r cd && nvim .'
bind e new-window -c "#{pane_current_path}" 'ranger'

# Git
bind g new-window -c "#{pane_current_path}" 'lazygit'

# Dark Purple Theme
set -g status-position top
set -g status-style 'bg=#121218,fg=#e0e0e0'
set -g window-status-format '#[fg=#606060] #I:#W '
set -g window-status-current-format '#[bg=#9d4edd,fg=#050505,bold] #I:#W '
set -g window-status-separator ''
set -g pane-border-style 'fg=#252538'
set -g pane-active-border-style 'fg=#9d4edd'
set -g status-left '#[bg=#9d4edd,fg=#050505,bold] #S #[bg=#121218] '
set -g status-right '#[fg=#606060]CPU: #(top -bn1 | grep "Cpu(s)" | awk "{print \$2}" | cut -d"%" -f1)%  #[fg=#606060]MEM: #(free | grep Mem | awk "{printf \"%.0f%%\", \$3/\$2 * 100.0}")  #[fg=#9d4edd]%I:%M%p #[fg=#e0e0e0]%a %d-%b '
set -g status-left-length 20
set -g status-right-length 100
set -g message-style 'bg=#9d4edd,fg=#050505'
set -g message-command-style 'bg=#9d4edd,fg=#050505'
set -g mode-style 'bg=#9d4edd,fg=#050505'

# Session management
bind-key S choose-session
bind-key ! new-session
bind-key X confirm-before -p "kill-session #S? (y/n)" kill-session

# Cheat sheet popups
bind-key Q display-popup -E -w 90% -h 90% -x C -y C 'less -R $REPOS_PATH/dotfiles/docs/cheat-tmux.txt'
bind-key W display-popup -E -w 90% -h 90% -x C -y C 'less -R $REPOS_PATH/dotfiles/docs/cheat-nvim.txt'
bind-key E display-popup -E -w 90% -h 90% -x C -y C 'less -R $REPOS_PATH/dotfiles/docs/cheat-bash.txt'

# Smart session manager
bind-key A run-shell ~/.tmux/plugins/t-smart-tmux-session-manager/bin/t

# Plugins
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'
set -g @plugin 'tmux-plugins/tmux-open'
set -g @plugin 'tmux-plugins/tmux-sessionist'
set -g @plugin 'joshmedeski/t-smart-tmux-session-manager'

set -g @continuum-restore 'on'
set -g @continuum-save-interval '0'

# Terminal
set -g default-terminal "screen-256color"
set -ga terminal-overrides ",xterm-256color*:Tc"
set -ga terminal-overrides '*:Ss=\E[%p1%d q:Se=\E[ q'

set -g display-time 2000
set -g display-panes-time 2000
setw -g monitor-activity on
set -g visual-activity off
setw -g aggressive-resize on
set-option -g allow-rename off

# Initialize TPM
run '~/.tmux/plugins/tpm/tpm'

# Force override plugin bindings (MUST be last)
bind-key -T copy-mode-vi y send-keys -X copy-pipe 'sed "s/[[:space:]]*$//" | if command -v xclip >/dev/null 2>&1; then xclip -selection clipboard -i; elif command -v pbcopy >/dev/null 2>&1; then pbcopy; fi'
bind-key -T copy-mode-vi Enter send-keys -X copy-pipe-and-cancel 'sed "s/[[:space:]]*$//" | if command -v xclip >/dev/null 2>&1; then xclip -selection clipboard -i; elif command -v pbcopy >/dev/null 2>&1; then pbcopy; fi'
bind-key -T copy-mode-vi MouseDragEnd1Pane send-keys -X stop-selection

set-option -g update-environment "DISPLAY SSH_ASKPASS SSH_AUTH_SOCK SSH_AGENT_PID SSH_CONNECTION WINDOWID XAUTHORITY"
